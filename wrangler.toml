name = "ebookcc"
main = "src/worker.ts"
compatibility_date = "2026-07-31"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/Models/*", "/models/*", "/wasm/*"]

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "ebookcckv"
id = "57aefa6f707a4863b9badff99ec607b4"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "ebookcc-media"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "ebookcc-media"


